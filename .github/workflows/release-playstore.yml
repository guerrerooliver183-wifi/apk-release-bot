
name: APK Release Automation

on:
  workflow_dispatch:
    inputs:
      package:
        description: Android package name (leave empty to use PACKAGE_NAME secret)
        required: false
        type: string

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: apk-release-${{ inputs.package || 'scheduled' }}
  cancel-in-progress: false

jobs:
  download-and-publish:
    runs-on: ubuntu-latest

    env:
      PACKAGE: ${{ inputs.package || secrets.PACKAGE_NAME }}
      TARGET_REPO: ${{ secrets.RELEASE_REPOSITORY }}

    steps:
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gplaydl
        run: python -m pip install gplaydl

      - name: Validate Configuration
        env:
          GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$PACKAGE" ]]; then
            echo "Error: PACKAGE_NAME is not configured."
            exit 1
          fi

          if [[ ! "$PACKAGE" =~ ^[A-Za-z0-9_]+(\.[A-Za-z0-9_]+)+$ ]]; then
            echo "Error: Invalid Android package name."
            exit 1
          fi

          if [[ ! "$TARGET_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Error: Invalid destination repository."
            exit 1
          fi

          if [[ -z "$GPLAYDL_API_KEY" || -z "$RELEASE_TOKEN" ]]; then
            echo "Error: Required secrets are missing."
            exit 1
          fi

      - name: Download APK Files
        env:
          GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}
        run: |
          set -euo pipefail

          mkdir -p apks
          gplaydl info "$PACKAGE"
          gplaydl download "$PACKAGE" -o ./apks

          VERSION_CODE=$(python - "$PACKAGE" <<'PY'
          import re
          import sys
          from pathlib import Path

          package = sys.argv[1]
          pattern = re.compile(
              re.escape(package) + r"-(\d+)\.apk"
          )

          versions = [
              match.group(1)
              for path in Path("apks").glob("*.apk")
              if (match := pattern.fullmatch(path.name))
          ]

          if not versions:
              raise SystemExit("Error: Base APK not found.")

          print(max(versions, key=int))
          PY
          )

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION_CODE" >> "$GITHUB_ENV"

          echo "Detected version code: $VERSION_CODE"

      - name: Validate Download
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(apks/"$PACKAGE"-*.apk)

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "Error: No APK files were downloaded."
            exit 1
          fi

          printf 'Downloaded %s APK file(s).\n' "${#files[@]}"

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" \
            --repo "$TARGET_REPO" >/dev/null 2>&1; then

            gh release create "$TAG" \
              --repo "$TARGET_REPO" \
              --title "$PACKAGE $TAG" \
              --notes "Android package: $PACKAGE
          Version code: $VERSION_CODE"
          fi

          gh release view "$TAG" \
            --repo "$TARGET_REPO" \
            --json assets \
            --jq '.assets[].name' |
          while IFS= read -r asset; do
            if [[ "$asset" == "$PACKAGE-"*.apk ]]; then
              echo "Removing existing asset: $asset"

              gh release delete-asset "$TAG" "$asset" \
                --repo "$TARGET_REPO" \
                --yes
            fi
          done

          shopt -s nullglob
          files=(apks/"$PACKAGE"-*.apk)

          gh release upload "$TAG" "${files[@]}" \
            --repo "$TARGET_REPO"

          echo "Release published successfully."
          echo "Repository: $TARGET_REPO"
          echo "Release tag: $TAG"
